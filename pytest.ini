[pytest]
testpaths = tests
# The two deselected tests from the lecturer's sanity suite assert that the AI
# core is still an empty stub (they expect NotImplementedError). They are
# meant to fail once classify_intent()/retrieve() are implemented, so the team
# deselects them here instead of editing test_project_12_sanity.py.
# See INTERFACE.md section 4.
addopts =
    --deselect tests/test_project_12_sanity.py::test_classify_intent_is_not_implemented
    --deselect tests/test_project_12_sanity.py::test_retrieve_is_not_implemented
