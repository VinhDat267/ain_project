[theme]
base = "light"
# Achromatic ledger: near-black primary action, neutral ground, one sans face (bundled, works offline)
primaryColor = "#141414"
backgroundColor = "#f8f8f8"
secondaryBackgroundColor = "#eeeeee"
textColor = "#0a0a0a"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
